<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Browser title -->
    <title>CPZONE - Limited CP Event</title>

    <!-- =====================================================
         FACEBOOK / MESSENGER LINK PREVIEW
         ===================================================== -->

    <meta
      property="og:title"
      content="CPZONE - Limited CP Event"
    />

    <meta
      property="og:description"
      content="Attention, Heroes! A special reward has been prepared for selected players. Don't miss your chance to claim it! 🎁"
    />

    <!-- THIS IS THE IMAGE MESSENGER WILL SHOW -->
    <meta
      property="og:image"
      content="https://codm-free-cp.vercel.app/assets/codm-pic.png"
    />

    <!-- THIS IS THE PAGE BEING SHARED -->
    <meta
      property="og:url"
      content="https://codm-free-cp.vercel.app/"
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="CPZONE"
    />

    <!-- Recommended preview image size -->
    <meta
      property="og:image:width"
      content="1200"
    />

    <meta
      property="og:image:height"
      content="630"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <!-- =====================================================
         TWITTER / X LINK PREVIEW
         ===================================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="CPZONE - Limited CP Event"
    />

    <meta
      name="twitter:description"
      content="Attention, Heroes! A special reward has been prepared for selected players. Don't miss your chance to claim it! 🎁"
    />

    <meta
      name="twitter:image"
      content="https://codm-free-cp.vercel.app/assets/codm-pic.png"
    />

    <!-- =====================================================
         FAVICON
         ===================================================== -->

    <link
      rel="icon"
      type="image/png"
      href="/assets/CODM-logo.png"
    />
  </head>

  <body>

    <!-- React application -->
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>

  </body>
</html>
